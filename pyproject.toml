[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "react-agent-loop"
version = "0.1.0"
description = "Act-only, ReAct and ReAct-IM agent loops from first principles"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
react-agent = "react_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
